<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday reminder</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="header">
      <button id="add-button">[+]</button>
      <p id="date-display"></p>
      <button id="close-button">[x]</button>
    </header>
    <main id="main">
      <section id="calendar"></section>
      <dialog id="dialog">
        <label for="dialog-name">Name:</label>
        <input id="dialog-name" type="text" placeholder="Name" autofocus>
        <br>
        <label for="dialog-day">Day:</label>
        <input id="dialog-day" type="number" min="1" max="31" placeholder="Day">
        <label for="dialog-month">Month:</label>
        <input id="dialog-month" type="number" min="1" max="12" placeholder="Month">
        <button id="dialog-button">[Submit]</button>
      </dialog>
    </main>
    <footer id="footer">
      <button id="this-month-button" class="selected">This month</button>
      <button id="next-month-button">Next month</button>
    </footer>
  </body>
</html>
